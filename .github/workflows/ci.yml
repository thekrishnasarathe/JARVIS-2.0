name: JARVIS 2.0 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Headless Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1-mesa libgl1-mesa-glx libxkbcommon-x11-0 xvfb

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install core and testing packages
        pip install pytest pytest-mock pytest-asyncio PyQt6 pyvista pyvistaqt qdarktheme psutil pyautogui requests

    - name: Run Test Suite (with Xvfb)
      run: |
        xvfb-run python -m pytest
